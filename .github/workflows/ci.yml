name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci_only_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Admin connection for the integration tests, which create and drop throwaway databases.
      TEST_PG_ADMIN: Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=ci_only_password
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore
      - name: Build (warnings are visible, not fatal)
        run: dotnet build --no-restore -c Release
      - name: Test (SQLite unit/web tests + real Postgres integration tests)
        run: dotnet test --no-build -c Release --logger "trx;LogFileName=results.trx" --results-directory TestResults
      - name: Fail if any Postgres test was skipped
        run: |
          if grep -q 'outcome="NotExecuted"' TestResults/results.trx; then
            echo "Postgres integration tests were skipped; TEST_PG_ADMIN is not working." >&2; exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults/
